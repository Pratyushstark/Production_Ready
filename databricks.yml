bundle:
  name: mlops-stag-bundle

targets:
  stag:
    workspace:
      host: https://dbc-292b7b7a-2dd0.cloud.databricks.com

resources:
  jobs:
    mlops_stag_pipeline:
      name: mlops-stag-pipeline

      tasks:
        - task_key: model_evaluation
          notebook_task:
            notebook_path: notebooks/05_evaluate_model.py
            base_parameters:
              env: stag
          compute: serverless

        - task_key: model_promote
          depends_on:
            - task_key: model_evaluation
          notebook_task:
            notebook_path: notebooks/06_model_promote.py
            base_parameters:
              env: stag
          compute: serverless